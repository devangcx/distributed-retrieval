name: distributed-retrieval

services:
  orchestrator:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      POSTGRES_SHARD_A_URL: postgres://retrieval_user:retrieval_password@postgres-shard-a:5432/retrieval
      POSTGRES_SHARD_B_URL: postgres://retrieval_user:retrieval_password@postgres-shard-b:5432/retrieval
      QDRANT_SHARD_A_URL: http://qdrant-shard-a:6333
      QDRANT_SHARD_B_URL: http://qdrant-shard-b:6333
      ORCHESTRATOR_BIND: 0.0.0.0:3000
    ports:
      - "3000:3000"
    depends_on:
      postgres-shard-a:
        condition: service_healthy
      postgres-shard-b:
        condition: service_healthy
      qdrant-shard-a:
        condition: service_started
      qdrant-shard-b:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:3000/health"]
      interval: 5s
      timeout: 3s
      retries: 10

  postgres-shard-a:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: retrieval
      POSTGRES_USER: retrieval_user
      POSTGRES_PASSWORD: retrieval_password
    # Published for access from host-side scripts; not required for container-to-container traffic
    ports:
      - "5433:5432"
    volumes:
      - postgres-shard-a-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U retrieval_user -d retrieval"]
      interval: 5s
      timeout: 3s
      retries: 20

  postgres-shard-b:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: retrieval
      POSTGRES_USER: retrieval_user
      POSTGRES_PASSWORD: retrieval_password
    # Published for access from host-side scripts; not required for container-to-container traffic
    ports:
      - "5434:5432"
    volumes:
      - postgres-shard-b-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U retrieval_user -d retrieval"]
      interval: 5s
      timeout: 3s
      retries: 20

  qdrant-shard-a:
    image: qdrant/qdrant:v1.13.6
    # Published for access from host-side scripts; not required for container-to-container traffic
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant-shard-a-data:/qdrant/storage

  qdrant-shard-b:
    image: qdrant/qdrant:v1.13.6
    # Published for access from host-side scripts; not required for container-to-container traffic
    ports:
      - "6335:6333"
      - "6336:6334"
    volumes:
      - qdrant-shard-b-data:/qdrant/storage

volumes:
  postgres-shard-a-data:
  postgres-shard-b-data:
  qdrant-shard-a-data:
  qdrant-shard-b-data:
