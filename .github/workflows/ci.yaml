name: CI

on: [push, pull_request]

jobs:
  python-tests:
    name: Python tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: dev-requirements.txt

      - name: Install Python dependencies
        run: python -m pip install -r dev-requirements.txt

      - name: Run Python tests
        run: python -m pytest

  rust-tests:
    name: Rust tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Rust
        run: rustup toolchain install stable --profile minimal

      - name: Run Rust tests
        run: cargo +stable test --locked

  release-on-github:
    name: Release on GitHub
    runs-on: ubuntu-latest
    needs: [python-tests, rust-tests]
    if: github.ref == 'refs/heads/master' && github.repository_owner == 'devangcx'
    steps:
      - uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 25

      - name: Run semantic release
        id: new_release
        run: |
          nextRelease="$(npx semantic-release --dryRun | grep -oP 'Published release \K.*? ' || true)"
          npx semantic-release
          echo "tag=$nextRelease" >> $GITHUB_OUTPUT
    env:
      GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
    outputs:
      tag: ${{ steps.new_release.outputs.tag }}
