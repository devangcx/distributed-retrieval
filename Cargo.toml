[package]
name = "distributed-retrieval"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8.9"
diesel = { version = "2.3.12", features = ["postgres_backend"] }
diesel-async = { version = "0.9.2", features = ["postgres", "deadpool"] }
dotenvy = "0.15.7"
serde = { version = "1", features = ["derive"] }
tokio = { version = "1.52.3", features = ["full"] }

[dev-dependencies]
serde_json = "1"
tower = { version = "0.5", features = ["util"] }
